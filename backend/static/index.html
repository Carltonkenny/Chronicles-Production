<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chronicles - AI Film Studio</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1117; color:#c9d1d9; font-family:'Consolas','Courier New',monospace; font-size:14px; line-height:1.5; height:100vh; display:flex; flex-direction:column; }

.header { background:#161b22; border-bottom:1px solid #30363d; padding:12px 20px; display:flex; align-items:center; gap:12px; flex-shrink:0; }
.header h1 { color:#58a6ff; font-size:18px; font-weight:600; }
.header .status { font-size:12px; color:#8b949e; margin-left:auto; }
.header .status .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
.header .status .dot.green { background:#3fb950; }
.header .status .dot.red { background:#f85149; }
.header .status .dot.yellow { background:#d29922; }

.container { display:flex; flex:1; overflow:hidden; }

.sidebar { width:340px; min-width:340px; background:#161b22; border-right:1px solid #30363d; padding:16px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; flex-shrink:0; }
.sidebar label { font-size:11px; color:#8b949e; text-transform:uppercase; letter-spacing:0.5px; display:block; margin-bottom:4px; }
.sidebar input, .sidebar select { width:100%; padding:8px 10px; background:#0d1117; border:1px solid #30363d; border-radius:6px; color:#c9d1d9; font-family:inherit; font-size:13px; outline:none; transition:border-color .2s; }
.sidebar input:focus, .sidebar select:focus { border-color:#58a6ff; }
.sidebar input { height:36px; }
.sidebar select { height:36px; cursor:pointer; }

.btn { width:100%; padding:10px; border:none; border-radius:6px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; margin-top:4px; }
.btn-generate { background:#238636; color:#fff; }
.btn-generate:hover { background:#2ea043; }
.btn-generate:disabled { background:#21262d; color:#484f58; cursor:not-allowed; }
.btn-stop { background:#da3633; color:#fff; }
.btn-stop:hover { background:#f85149; }

.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

.tabs { display:flex; background:#161b22; border-bottom:1px solid #30363d; flex-shrink:0; }
.tab { padding:10px 20px; cursor:pointer; color:#8b949e; font-size:13px; border-bottom:2px solid transparent; transition:all .2s; }
.tab:hover { color:#c9d1d9; }
.tab.active { color:#58a6ff; border-bottom-color:#58a6ff; }
.tab .count { background:#21262d; padding:1px 7px; border-radius:10px; font-size:11px; margin-left:6px; }

.panel { flex:1; overflow-y:auto; display:none; padding:12px; }
.panel.active { display:block; }

.log-entry { padding:6px 10px; margin-bottom:4px; border-radius:4px; font-size:13px; border-left:3px solid #30363d; background:#0d1117; }
.log-entry .time { color:#8b949e; font-size:11px; margin-right:8px; }
.log-entry .agent { font-weight:600; margin-right:8px; }
.log-entry .msg { color:#c9d1d9; }
.log-entry.story { border-left-color:#3fb950; }
.log-entry.story .agent { color:#3fb950; }
.log-entry.visual { border-left-color:#d29922; }
.log-entry.visual .agent { color:#d29922; }
.log-entry.images { border-left-color:#f0883e; }
.log-entry.images .agent { color:#f0883e; }
.log-entry.video { border-left-color:#58a6ff; }
.log-entry.video .agent { color:#58a6ff; }
.log-entry.post { border-left-color:#bc8cff; }
.log-entry.post .agent { color:#bc8cff; }
.log-entry.error { border-left-color:#f85149; }
.log-entry.error .agent { color:#f85149; }
.log-entry.done { border-left-color:#3fb950; background:#0d1117; font-weight:600; }
.log-entry.done .agent { color:#3fb950; }

.image-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
.image-card { background:#161b22; border:1px solid #30363d; border-radius:6px; overflow:hidden; }
.image-card img { width:100%; height:120px; object-fit:cover; display:block; }
.image-card .label { padding:4px 8px; font-size:11px; color:#8b949e; }

.story-book { max-width:800px; margin:0 auto; }
.story-book .card { background:#161b22; border:1px solid #30363d; border-radius:8px; padding:24px; margin-bottom:16px; }
.story-book .card h1 { color:#58a6ff; font-size:22px; margin-bottom:8px; font-weight:600; }
.story-book .card .subtitle { color:#8b949e; font-size:13px; margin-bottom:12px; }
.story-book .tags { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.story-book .tag { background:#1f2937; color:#c9d1d9; padding:4px 12px; border-radius:12px; font-size:12px; border:1px solid #30363d; }
.story-book .tag.culture { border-color:#58a6ff; color:#58a6ff; }
.story-book .tag.timeline { border-color:#d29922; color:#d29922; }
.story-book .tag.theme { border-color:#bc8cff; color:#bc8cff; }
.story-book .char-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-bottom:20px; }
.story-book .char-card { background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:12px; text-align:center; }
.story-book .char-card .avatar { width:72px; height:72px; border-radius:50%; margin:0 auto 8px; object-fit:cover; background:#21262d; display:flex; align-items:center; justify-content:center; font-size:28px; }
.story-book .char-card .cname { font-size:13px; font-weight:600; color:#c9d1d9; margin-bottom:2px; }
.story-book .char-card .crole { font-size:11px; color:#8b949e; }
.story-book .setting { background:#0d1117; border-left:3px solid #30363d; padding:12px 16px; border-radius:0 6px 6px 0; margin-bottom:16px; font-size:13px; color:#8b949e; line-height:1.6; }
.story-book .story-text { font-size:14px; color:#c9d1d9; line-height:1.7; }
.story-book .story-text .preview { }
.story-book .story-text .full { display:none; }
.story-book .story-text.expanded .preview { display:none; }
.story-book .story-text.expanded .full { display:inline; }
.story-book .toggle-btn { background:none; border:none; color:#58a6ff; cursor:pointer; font-size:13px; padding:0; margin-top:8px; font-family:inherit; }
.story-book .toggle-btn:hover { text-decoration:underline; }
.story-book .action-bar { display:flex; gap:12px; margin-top:16px; flex-wrap:wrap; }
.story-book .action-btn { padding:8px 20px; border:none; border-radius:6px; font-family:inherit; font-size:13px; font-weight:600; cursor:pointer; transition:all .2s; }
.story-book .action-btn.gallery { background:#1f2937; color:#c9d1d9; }
.story-book .action-btn.gallery:hover { background:#30363d; }
.story-book .action-btn.listen { background:#1f2937; color:#c9d1d9; }
.story-book .action-btn.listen:hover { background:#30363d; }
.story-book .action-btn.listen.active { background:#1a7f37; color:#fff; }
.story-book .action-btn.watch { background:#1f2937; color:#c9d1d9; }
.story-book .action-btn.watch:hover { background:#30363d; }
.story-book .action-btn.watch.active { background:#1f6feb; color:#fff; }
.story-book .placeholder { text-align:center; padding:60px 20px; color:#8b949e; }
.pipe-step { font-size:12px; padding:3px 0; color:#8b949e; }
.pipe-step.done { color:#3fb950; }
.pipe-step.fail { color:#f85149; }
.pipe-step.pending { color:#8b949e; }
.story-book .placeholder .icon { font-size:48px; margin-bottom:12px; }

.audio-player { max-width:800px; margin:16px auto; }
.audio-player audio { width:100%; }

.video-container { max-width:800px; margin:0 auto; }
.video-container video { width:100%; border-radius:8px; border:1px solid #30363d; }
.video-container .info { margin-top:12px; padding:12px; background:#161b22; border-radius:6px; font-size:13px; color:#8b949e; }

#detail-view { position:fixed; right:0; top:0; width:420px; height:100%; background:#161b22; border-left:1px solid #30363d; padding:16px; overflow-y:auto; display:none; z-index:100; }
#detail-view h3 { color:#58a6ff; margin-bottom:8px; }
#detail-view pre { background:#0d1117; padding:12px; border-radius:6px; font-size:12px; white-space:pre-wrap; word-break:break-word; max-height:80vh; overflow-y:auto; }
#detail-close { float:right; cursor:pointer; color:#8b949e; font-size:18px; }
#detail-close:hover { color:#c9d1d9; }

::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background:#0d1117; }
::-webkit-scrollbar-thumb { background:#30363d; border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:#484f58; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ Chronicles</h1>
  <span style="color:#8b949e;font-size:12px;">AI Film Studio</span>
  <div class="status">
    <span id="statusDot" class="dot yellow"></span>
    <span id="statusText">Connecting...</span>
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <div>
      <label>Seed Idea</label>
      <input id="seed" placeholder="A blind monk who paints the future by touching fire..." value="A blind monk who can paint the future by touching fire">
    </div>
    <div>
      <label>Culture</label>
      <select id="culture"></select>
    </div>
    <div>
      <label>Timeline</label>
      <select id="timeline"></select>
    </div>
    <div>
      <label>Theme</label>
      <select id="theme"></select>
    </div>
    <button class="btn btn-generate" id="generateBtn" onclick="generate()">🎬 Generate Film</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stop()" style="display:none;">⏹ Stop</button>
    <div id="errorBox" style="display:none;padding:8px;background:#3d1214;border:1px solid #f85149;border-radius:6px;color:#f85149;font-size:12px;margin-top:8px;"></div>
    <div id="pipelineStatus" style="display:none;margin-top:8px;">
      <div style="font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Pipeline Status</div>
      <div id="pipe-story" class="pipe-step">⏳ Story</div>
      <div id="pipe-visual" class="pipe-step">⏳ Visual Bible</div>
      <div id="pipe-images" class="pipe-step">⏳ Images</div>
      <div id="pipe-video" class="pipe-step">⏳ Video</div>
      <div id="pipe-post" class="pipe-step">⏳ Post-Production</div>
      <div id="pipe-film" class="pipe-step">⏳ Film Ready</div>
    </div>
  </div>

  <div class="main">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('story',this)">📖 Story</div>
      <div class="tab" onclick="switchTab('log',this)">📋 Log <span class="count" id="logCount">0</span></div>
      <div class="tab" onclick="switchTab('images',this)">🖼 Images <span class="count" id="imageCount">0</span></div>
      <div class="tab" onclick="switchTab('video',this)">🎥 Film</div>
    </div>
    <div id="storyPanel" class="panel active"><div class="story-book" id="storyBook"></div></div>
    <div id="logPanel" class="panel"></div>
    <div id="imagesPanel" class="panel"><div class="image-grid" id="imageGrid"></div></div>
    <div id="videoPanel" class="panel"><div class="video-container" id="videoContainer"></div></div>
  </div>
</div>

<div id="detail-view">
  <span id="detail-close" onclick="closeDetail()">✕</span>
  <h3 id="detailTitle">Agent Detail</h3>
  <pre id="detailContent"></pre>
</div>

<script>
let eventSource = null;
let logEntries = [];
let imageUrls = [];
let entryId = 0;
let storyData = null;
let portraitData = {};
let audioUrl = null;

async function init() {
  try {
    const resp = await fetch('/options');
    if (!resp.ok) throw new Error('Backend not reachable');
    const data = await resp.json();
    setStatus(true);

    let firstGroup = true;
    for (const [groupLabel, items] of Object.entries(data.cultures)) {
      for (const item of items) {
        const opt = document.createElement('option');
        opt.value = item.value;
        opt.textContent = item.label;
        if (firstGroup) opt.selected = true;
        document.getElementById('culture').appendChild(opt);
      }
      firstGroup = false;
    }

    for (const [groupLabel, items] of Object.entries(data.timelines)) {
      for (const item of items) {
        const opt = document.createElement('option');
        opt.value = item.value; opt.textContent = item.label;
        document.getElementById('timeline').appendChild(opt);
      }
    }

    for (const [groupLabel, items] of Object.entries(data.themes)) {
      for (const item of items) {
        const opt = document.createElement('option');
        opt.value = item.value; opt.textContent = item.label;
        document.getElementById('theme').appendChild(opt);
      }
    }
  } catch (e) {
    setStatus(false, 'Backend offline — start Chronicles first');
  }
}

function setStatus(ok, msg) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (ok) { dot.className = 'dot green'; txt.textContent = msg || 'Backend Online'; }
  else { dot.className = 'dot red'; txt.textContent = msg || 'Offline'; }
}

function log(phase, agent, msg, data) {
  const cls = phase;
  const time = new Date().toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'log-entry ' + cls;
  const hasPayload = data && data.data && typeof data.data === 'object' && Object.keys(data.data).length > 0;
  const detail = hasPayload ? data.data : { agent: agent, phase: phase, message: msg, progress: (data && data.pct) || '' };
  div.innerHTML = `<span class="time">[${time}]</span><span class="agent">${agent}</span><span class="msg">${msg}</span>`;
  if (data) {
    div.style.cursor = 'pointer';
    div.onclick = () => showDetail(agent + ' - ' + (data.step || 'progress'), detail);
  }
  document.getElementById('logPanel').appendChild(div);
  document.getElementById('logPanel').scrollTop = document.getElementById('logPanel').scrollHeight;
  document.getElementById('logCount').textContent = ++entryId;
}

function showDetail(title, content) {
  document.getElementById('detailTitle').textContent = title;
  document.getElementById('detailContent').textContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
  document.getElementById('detail-view').style.display = 'block';
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
}

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(name + 'Panel').classList.add('active');
}

async function generate() {
  const seed = document.getElementById('seed').value.trim();
  if (!seed) { showError('Enter a seed idea'); return; }

  document.getElementById('generateBtn').disabled = true;
  document.getElementById('generateBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
  document.getElementById('errorBox').style.display = 'none';
  storyData = null; portraitData = {}; audioUrl = null; mp4Url = null;
  document.getElementById('logPanel').innerHTML = '';
  document.getElementById('imageGrid').innerHTML = '';
  document.getElementById('videoContainer').innerHTML = '';
  document.getElementById('storyBook').innerHTML = '<div class="placeholder"><div class="icon">⏳</div><p>Generating your film...</p></div>';
  document.getElementById('imageCount').textContent = '0';
  entryId = 0;
  imageUrls = [];
  ['story','visual','images','video','post','film'].forEach(p => {
    const el = document.getElementById('pipe-'+p);
    if (el) { el.className = 'pipe-step pending'; el.textContent = el.textContent.replace(/^. /,'… '); }
  });
  document.getElementById('pipelineStatus').style.display = 'block';

  const payload = {
    seed_idea: seed,
    culture: document.getElementById('culture').value,
    timeline: document.getElementById('timeline').value,
    theme: document.getElementById('theme').value,
  };

  log('story', 'System', `🎬 Generating film: "${seed.substring(0,50)}..."`);
  log('story', 'System', `→ ${payload.culture}, ${payload.timeline}, ${payload.theme}`);

  try {
    const resp = await fetch('/generate-film', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(err);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          const eventType = line.slice(7).trim();
          continue;
        }
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            handleEvent(data);
          } catch (e) {
            // ignore parse errors on partial lines
          }
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      log('error', 'System', '⏹ Generation stopped');
    } else {
      log('error', 'Error', e.message || 'Connection lost');
      showError(e.message);
    }
  }

  document.getElementById('generateBtn').disabled = false;
  document.getElementById('generateBtn').style.display = 'block';
  document.getElementById('stopBtn').style.display = 'none';
}

function stop() {
  if (eventSource) { eventSource.close(); eventSource = null; }
  log('error', 'System', '⏹ Stopped by user');
  document.getElementById('generateBtn').disabled = false;
  document.getElementById('generateBtn').style.display = 'block';
  document.getElementById('stopBtn').style.display = 'none';
}

function handleEvent(data) {
  const p = data.phase || '';
  const s = data.step || '';
  const msg = data.message || '';
  const pct = data.pct || 0;

  // Map phase+step to log category
  let category = 'story';
  let agent = '';
  let displayMsg = msg;

  if (p === 'story') {
    category = 'story';
    agent = s === 'planning' ? 'Planner' : s === 'writing' ? 'Writer' : s === 'supervising' ? 'Supervisor' : 'Story';
    if (s === 'planning') setPipe('story', 'pending', 'Story');
    if (s === 'complete') {
      if (data.data) {
        storyData = { ...data.data };
        storyData.culture = document.getElementById('culture').value;
        storyData.timeline = document.getElementById('timeline').value;
        storyData.theme = document.getElementById('theme').value;
      }
      setPipe('story', 'done', 'Story');
      renderStoryBook();
    }
  } else if (p === 'visual_bible') {
    category = 'visual';
    agent = s === 'director' ? 'Director' : s === 'pd' ? 'Prod Designer' : s === 'ad' ? 'Art Director' : 'Visual Bible';
    if (s === 'complete' || s === 'done') setPipe('visual', 'done', 'Visual Bible');
  } else if (p === 'images') {
    category = 'images';
    agent = s === 'swarming' ? 'Image Swarm' : 'Images';
    if (data.data) {
      document.getElementById('imageGrid').innerHTML = '';
      if (data.data.characters) {
        Object.entries(data.data.characters).forEach(([name, urls]) => {
          const labels = ['full body', 'close-up', 'action'];
          urls.forEach((url, i) => addImage(url, name, labels[i] || ''));
        });
        portraitData = data.data.characters;
        const count = Object.values(data.data.characters).flat().length;
        displayMsg = `${count} character portraits generated`;
      }
      if (data.data.scenes) {
        data.data.scenes.forEach((url, i) => addImage(url, `Scene ${i+1}`));
        displayMsg += ` + ${data.data.scenes.length} scene keyframes`;
      }
      if (s === 'swarming') setPipe('images', 'pending', 'Images');
      if (s === 'complete') {
        setPipe('images', 'done', 'Images');
        renderStoryBook();
      }
    }
  } else if (p === 'video') {
    category = 'video';
    agent = 'GPU';
    if (s === 'crafting') setPipe('video', 'pending', 'Video');
    if (s === 'generation') setPipe('video', 'done', 'Video');
    if (s === 'failed') setPipe('video', 'fail', 'Video');
  } else if (p === 'post') {
    category = 'post';
    agent = s === 'audio' ? 'Sound Designer' : s === 'editing' ? 'Editor' : s === 'sound' ? 'Sound' : s === 'color' ? 'Colorist' : s === 'assembly' ? 'FFmpeg' : 'Post';
    if (s === 'audio' || s === 'editing') setPipe('post', 'pending', 'Post-Production');
    if (s === 'assembly') { setPipe('post', 'done', 'Post-Production'); }
    if (s === 'audio_complete' && data.data && data.data.audio_url) {
      audioUrl = data.data.audio_url;
    }
  } else if (p === 'done') {
    category = 'done';
    agent = 'Done';
    displayMsg = '✅ Film complete!';
    setPipe('film', 'done', 'Film Ready ✅');
    const filmData = data.data || {};
    if (filmData.mp4_url) {
      showVideo(filmData.mp4_url);
    }
    return;
  }

  log(category, agent, displayMsg || `${s} (${pct}%)`, data);
}

function setPipe(id, status, label) {
  const el = document.getElementById('pipe-' + id);
  if (!el) return;
  el.className = 'pipe-step ' + status;
  el.textContent = (status === 'done' ? '✅ ' : status === 'fail' ? '❌ ' : '⏳ ') + label;
}

function renderStoryBook() {
  const book = document.getElementById('storyBook');
  if (!storyData) {
    book.innerHTML = '<div class="placeholder"><div class="icon">📖</div><p>Generate a film to see your story here.</p></div>';
    return;
  }
  const title = storyData.title || 'Untitled';
  const setting = storyData.setting || '';
  const story = storyData.story || '';
  const chars = storyData.characters || [];
  const previewText = story.substring(0, 300) + (story.length > 300 ? '...' : '');

  let charCards = '';
  const charKeys = Object.keys(portraitData);
  if (charKeys.length > 0) {
    charKeys.forEach(name => {
      const urls = portraitData[name];
      const imgUrl = urls && urls.length > 0 ? urls[0] : '';
      const role = '';
      charCards += `
        <div class="char-card">
          ${imgUrl ? `<img class="avatar" src="${imgUrl}" alt="${name}">` : `<div class="avatar">🧑</div>`}
          <div class="cname">${name}</div>
          <div class="crole">${role}</div>
        </div>`;
    });
  } else if (chars.length > 0) {
    chars.forEach(c => {
      const name = typeof c === 'string' ? c.split(':')[0].trim() : (c.name || 'Character');
      charCards += `
        <div class="char-card">
          <div class="avatar">🧑</div>
          <div class="cname">${name}</div>
        </div>`;
    });
  }

  const tags = `
    <span class="tag culture">${storyData.culture || ''}</span>
    <span class="tag timeline">${storyData.timeline || ''}</span>
    <span class="tag theme">${storyData.theme || ''}</span>
  `;

  book.innerHTML = `
    <div class="card">
      <h1>${title}</h1>
      <div class="subtitle">Chronicles AI Film</div>
      <div class="tags">${tags}</div>
      ${charCards ? `<div class="char-grid">${charCards}</div>` : ''}
      ${setting ? `<div class="setting">${setting}</div>` : ''}
      ${story ? `<div class="story-text" id="storyText">
        <div class="preview">${previewText}</div>
        <div class="full">${story}</div>
        ${story.length > 300 ? `<button class="toggle-btn" onclick="toggleStory()">Read full story ▼</button>` : ''}
      </div>` : ''}
      <div class="action-bar">
        <button class="action-btn gallery" onclick="switchTab('images',document.querySelectorAll('.tab')[2])">🖼 Gallery</button>
        <button class="action-btn listen ${audioUrl ? 'active' : ''}" onclick="playAudio()">🔊 ${audioUrl ? 'Listen' : 'Audio...'}</button>
        <button class="action-btn watch ${mp4Url ? 'active' : ''}" onclick="switchTab('video',document.querySelectorAll('.tab')[3])">🎬 ${mp4Url ? 'Watch Film' : 'Generating...'}</button>
      </div>
    </div>`;
  switchTab('story', document.querySelectorAll('.tab')[0]);
}

function toggleStory() {
  const el = document.getElementById('storyText');
  el.classList.toggle('expanded');
  el.querySelector('.toggle-btn').textContent = el.classList.contains('expanded') ? '▲ Show less' : 'Read full story ▼';
}

let mp4Url = null;

function playAudio() {
  if (audioUrl) {
    const fullUrl = audioUrl.startsWith('http') ? audioUrl : window.location.origin + audioUrl;
    window.open(fullUrl, '_blank');
  }
}

function addImage(url, label, variation) {
  const grid = document.getElementById('imageGrid');
  const card = document.createElement('div');
  card.className = 'image-card';
  const displayLabel = variation ? `${label} (${variation})` : label;
  card.innerHTML = `<img src="${url}" loading="lazy" onclick="fullscreen(this.src)" style="cursor:pointer" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22120%22><rect fill=%22%2330363d%22 width=%22160%22 height=%22120%22/><text x=%2280%22 y=%2260%22 text-anchor=%22middle%22 fill=%22%238b949e%22 font-size=%2212%22>Failed to load</text></svg>'"><div class="label">${displayLabel}</div>`;
  card.onclick = () => fullscreen(url);
  card.style.cursor = 'pointer';
  grid.appendChild(card);
  document.getElementById('imageCount').textContent = grid.children.length;
}

function fullscreen(url) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;background:#000e;z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer';
  el.innerHTML = `<img src="${url}" style="max-width:90vw;max-height:90vh;border-radius:8px;">`;
  el.onclick = () => el.remove();
  document.body.appendChild(el);
}

function showVideo(url) {
  mp4Url = url;
  const container = document.getElementById('videoContainer');
  const fullUrl = url.startsWith('http') ? url : window.location.origin + url;
  container.innerHTML = `
    <video controls autoplay>
      <source src="${fullUrl}" type="video/mp4">
    </video>
    <div class="info">
      <strong>Film Ready</strong> — <a href="${fullUrl}" download style="color:#58a6ff;">Download MP4</a>
    </div>
  `;
  renderStoryBook();
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = '❌ ' + msg;
  box.style.display = 'block';
}

init();
</script>
</body>
</html>
