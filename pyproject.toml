[project]
name = "chronicles-production"
version = "4.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx==0.28.1",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
    "aiofiles>=23.2.1",
    "supabase>=2.3.0",
    "structlog>=24.0",
    "slowapi>=0.1",
    "redis>=5.0",
    "wikipedia-api>=0.6.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
